version: '3.8'

services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: muon-api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      # Coolify provides these service names as hostnames
      DATABASE_URL: postgresql://postgres@postgresql-database-c13ggi19xnfx09thpuycsjyn:5432/postgres
      REDIS_HOST: redis-database-rrwmyqsrhl15uhc2wl0v4112
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NODE_ENV: production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - default

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: muon-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default

  # Coolify will inject these services, but we define them for local dev
  postgres:
    image: postgres:15-alpine
    container_name: muon-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muon_secure_password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: muon-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  redis_data: